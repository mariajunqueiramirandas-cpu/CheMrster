# Publishes a GitHub release for every commit that lands on main.
# Each release is tagged v<package.json version>-<short sha>, so every commit gets its own tag.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version package.json)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          TAG="v${VERSION}-${SHORT_SHA}"

          # Re-running the workflow for the same commit must not fail on an existing release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
