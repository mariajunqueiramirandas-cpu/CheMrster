# Publishes a GitHub release for every commit that lands on main, with the Android APK attached.
# Each release is tagged v<package.json version>-<short sha>, so every commit gets its own tag.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install
      # Signed with the debug key: fine to install directly, not for the Play Store (see mobile/README.md).
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: chemrster-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

  release:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: chemrster-apk

      - name: Create release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version package.json)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          TAG="v${VERSION}-${SHORT_SHA}"
          APK="chemrster-${TAG}.apk"
          mv app-release.apk "$APK"

          # Re-running the workflow for the same commit must not fail on an existing release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi

          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
