<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#E8ECEF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151B22" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Química orgânica para o ENEM, do zero ao herói, com estruturas desenhadas como num livro impresso." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CheMrster" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap"
    />
    <title>CheMrster</title>
    <style>
      /* Painted before any script runs, so a phone on a slow connection never sees a blank page. */
      html { background: #e8ecef; }
      @media (prefers-color-scheme: dark) { html { background: #151b22; } }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 18px; }
      .boot svg, .boot img { width: 64px; height: 64px; border-radius: 16px; }
      .boot span { width: 120px; height: 4px; border-radius: 2px; background: rgb(192 21 122 / 0.18); overflow: hidden; }
      .boot span::after { content: ''; display: block; width: 40%; height: 100%; border-radius: inherit; background: #c0157a; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot span::after { animation: none; width: 100%; opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Carregando CheMrster">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#C0157A"/><g fill="none" stroke="#fff" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"><path d="M32 13 48.5 22.5v19L32 51 15.5 41.5v-19Z"/><path d="M20.5 25.4v13.2M32 45.3l11.4-6.6M43.4 25.3 32 18.7"/></g></svg>
        <span></span>
      </div>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
