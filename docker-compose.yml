# CheMrster on Dokploy (or any Docker host): the app and its Postgres database.
#
# In Dokploy: create a "Compose" service from this repository, fill in the variables in the
# Environment tab (see .env.example), turn on Isolated Deployments in Advanced, then add the
# domain in the Domains tab pointing at service "app", port 3000. Details in README.md.
#
# Elsewhere: `cp .env.example .env`, fill it in, `docker compose up -d --build`, and put a
# TLS-terminating proxy in front of port 3000 (uncomment `ports` below to reach it directly).

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:?Defina APP_URL, a URL pública do app (https://...)}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Defina CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Defina CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      PRO_PRICE_BRL: ${PRO_PRICE_BRL:-19.90}
      PRO_REASON: ${PRO_REASON:-CheMrster Pro}
      DATABASE_URL: postgres://chemrster:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/chemrster
      TUTOR_DAILY_LIMIT_FREE: ${TUTOR_DAILY_LIMIT_FREE:-20}
      TUTOR_DAILY_LIMIT_PLUS: ${TUTOR_DAILY_LIMIT_PLUS:-400}
      TUTOR_MODELS: ${TUTOR_MODELS:-claude-opus-5-5,claude-sonnet-5-5,claude-haiku-5-5}
      QUOTA_TIME_ZONE: ${QUOTA_TIME_ZONE:-America/Sao_Paulo}
    expose:
      - "3000"
    # ports:
    #   - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chemrster
      POSTGRES_DB: chemrster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      # A named volume, so Dokploy's Volume Backups can back it up.
      - chemrster-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chemrster -d chemrster"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chemrster-db:
